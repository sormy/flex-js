name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 'lts/-1'
            label: previous LTS
          - node: 'lts/*'
            label: current LTS
          - node: 'current'
            label: latest release

    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: node --version

      # npm test builds the generator from the upstream flex sources first
      - name: Install what the generator is built with
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool \
            bison m4 gettext

      - name: Reuse the generator built for these patches
        uses: actions/cache@v4
        with:
          path: build/flex
          key: flex-${{ hashFiles('build.sh', 'patches/**') }}

      - run: npm ci

      - run: npm test

      # The shim, the platform table and the bundled-m4 lookup, which nothing
      # above reaches. Cross-building every platform is build-dist.sh's job.
      - name: Put the host generator where the shim looks for it
        run: |
          mkdir -p dist
          cp build/flex/src/flex dist/flex-js-linux-x64

      - run: npm run test:dist
