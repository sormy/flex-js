name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 'lts/-1'
            label: previous LTS
          - node: 'lts/*'
            label: current LTS
          - node: 'current'
            label: latest release

    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: node --version

      - run: npm ci

      - run: npm test
